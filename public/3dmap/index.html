<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>バックスタンド3Dマップ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: 3D stage on the left, control panel on the right; stacks on phones.
   Palette: pitch-side neutrals with a green bias, Antlers crimson as the one accent, amber for the selected seat. */
:root{
  --bg:#EDEFEA; --panel:#F7F8F4; --fg:#17201C; --muted:#5A655E; --line:#D2D8D1;
  --accent:#B3202A; --accent-ink:#FFFFFF; --hi:#E2A21E; --hud:rgba(247,248,244,.84);
  --font-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --s-bg:#DDE4DE; --s-ground:#C3CCC4; --s-concrete:#A9B1AB; --s-ghost:#8F9A93;
  --s-seat1:#C8343C; --s-seat2:#8E1F2A; --s-dim:#B7BDB8; --s-hi:#F0B429;
  --s-pitchA:#4B9A56; --s-pitchB:#459150; --s-roof:#E9EEEA; --s-label:#17201C; --s-line:#F5F7F4;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1311; --panel:#151C19; --fg:#E6ECE7; --muted:#92A09A; --line:#28332E;
    --accent:#E0555D; --accent-ink:#1A0A0C; --hi:#F2B94B; --hud:rgba(21,28,25,.84);
    --s-bg:#0A100E; --s-ground:#121A17; --s-concrete:#3F4A45; --s-ghost:#5C6963;
    --s-seat1:#D4474F; --s-seat2:#962B36; --s-dim:#2E3732; --s-hi:#F2B94B;
    --s-pitchA:#2F6B39; --s-pitchB:#2B6335; --s-roof:#56625C; --s-label:#E6ECE7; --s-line:#DCE4DE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1311; --panel:#151C19; --fg:#E6ECE7; --muted:#92A09A; --line:#28332E;
  --accent:#E0555D; --accent-ink:#1A0A0C; --hi:#F2B94B; --hud:rgba(21,28,25,.84);
  --s-bg:#0A100E; --s-ground:#121A17; --s-concrete:#3F4A45; --s-ghost:#5C6963;
  --s-seat1:#D4474F; --s-seat2:#962B36; --s-dim:#2E3732; --s-hi:#F2B94B;
  --s-pitchA:#2F6B39; --s-pitchB:#2B6335; --s-roof:#56625C; --s-label:#E6ECE7; --s-line:#DCE4DE;
  color-scheme:dark;
}

html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.65 var(--font-body);
  padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  box-sizing:border-box;
}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:12px}
.stage{position:relative;min-height:0;min-width:0;border-radius:10px;overflow:hidden;background:var(--s-bg);border:1px solid var(--line)}
#c{display:block;width:100%;height:100%;touch-action:none;outline:none;cursor:grab}
#c:active{cursor:grabbing}
#c:focus-visible{outline:2px solid var(--hi);outline-offset:-2px}
.hud{position:absolute;left:10px;top:10px;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;background:var(--hud);font:500 12px/1 var(--font-mono);letter-spacing:.04em;pointer-events:none}
.hud i{width:8px;height:8px;border-radius:50%;background:var(--accent);display:block}
.hint{position:absolute;left:10px;bottom:10px;right:10px;padding:6px 10px;border-radius:6px;background:var(--hud);font:400 11.5px/1.5 var(--font-body);color:var(--muted);pointer-events:none;width:fit-content;max-width:calc(100% - 20px)}
.fail{padding:24px;font-size:14px}

.panel{min-height:0;min-width:0;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px 18px 24px;display:flex;flex-direction:column;gap:22px}
.eyebrow{font:500 11px/1.4 var(--font-mono);letter-spacing:.06em;color:var(--accent);margin:0 0 8px}
h1{font:400 26px/1.3 var(--font-display);margin:0;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--muted);font-size:13px}
h2{font:700 12px/1.3 var(--font-body);letter-spacing:.12em;color:var(--muted);margin:0 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{font:500 13px/1 var(--font-body);min-height:36px;padding:0 12px;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.checks{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:10px}
.checks label{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0}
.sub{margin:0 0 8px;font-size:12px;color:var(--muted)}

.zones{display:grid;gap:12px}
.zones .zhead{font:500 12px/1.4 var(--font-body);color:var(--muted);margin-bottom:6px}
.zones .zgroup{display:grid;gap:4px}
.zones .zgroup.g10{grid-template-columns:repeat(10,minmax(0,1fr))}
.zones button{font:500 11px/1 var(--font-mono);color:var(--fg);padding:0;min-height:34px;border:1px solid var(--line);background:transparent;border-radius:6px;cursor:pointer;box-shadow:inset 0 -4px 0 var(--tc)}
.zones button[data-t="1"]{--tc:var(--s-seat1)}
.zones button[data-t="2"]{--tc:var(--s-seat2)}
.zones button[aria-pressed="true"]{background:var(--hi);border-color:var(--hi)}

.card{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:12px}
.card .name{font:700 16px/1.3 var(--font-body)}
.card .empty{margin:0;color:var(--muted);font-size:13px}
.stats,.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13px}
.stats dt,.facts dt{color:var(--muted)}
.stats dd,.facts dd{margin:0;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
.rowline{display:flex;justify-content:space-between;font-size:13px}
.rowline b{font-family:var(--font-mono);font-weight:500;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--accent);margin:4px 0 0}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btns button{font:700 13px/1 var(--font-body);min-height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btns button.ghost{background:transparent;color:var(--fg);border-color:var(--line);font-weight:500}
.btns button[hidden]{display:none}

.note{font-size:12px;color:var(--muted);margin:0}
.src{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:4px;font-size:12px}
.src a{color:var(--fg);text-underline-offset:3px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,50%) minmax(0,50%)}
  h1{font-size:22px}
  .hint{display:none}
}
</style>

<div class="app">
  <div class="stage" id="stage">
    <canvas id="c" tabindex="0" aria-label="バックスタンドの3Dモデル。ドラッグで視点を回転、ホイールで拡大縮小。"></canvas>
    <div class="hud"><i></i><span id="hudText">俯瞰</span></div>
  </div>

  <aside class="panel" aria-label="操作パネル">
    <header>
      <p class="eyebrow">茨城県立カシマサッカースタジアム</p>
      <h1>メルカリスタジアム<br>バックスタンド</h1>
    </header>

    <section>
      <h2>視点</h2>
      <div class="seg" id="views">
        <button type="button" data-view="overview" aria-pressed="true">俯瞰</button>
      </div>
    </section>

    <section>
      <h2>表示</h2>
      <div class="seg" id="tiers">
        <button type="button" data-tier="all" aria-pressed="true">全層</button>
        <button type="button" data-tier="1" aria-pressed="false">1層のみ</button>
        <button type="button" data-tier="2" aria-pressed="false">2層のみ</button>
      </div>
      <div class="checks">
        <label><input type="checkbox" id="hideUpper"> 上層を隠す</label>
        <label><input type="checkbox" id="gatesOn" checked> 入口</label>
        <label><input type="checkbox" id="restOn"> トイレ</label>
        <label><input type="checkbox" id="onlyFloor"> コンコースを1階層ずつ</label>
      </div>
    </section>

    <section>
      <h2>入口(南から北)</h2>
      <div class="seg" id="gates"></div>
      <div class="btns" style="margin-top:8px">
        <button type="button" id="gateView">入口からピッチを見る</button>
        <button type="button" id="gateBack" class="ghost" hidden>全体に戻る</button>
      </div>
    </section>

    <section>
      <h2>フロア</h2>
      <div class="seg" id="floors"></div>
      <p class="sub" id="floorInfo" hidden style="margin-top:10px" aria-live="polite">階を選ぶと、入口やコンコース、入れるスタンドを確認できます。</p>
    </section>

    <section>
      <h2>区画を選ぶ</h2>
      <div class="zones" id="zones"></div>
    </section>

    <section>
      <h2>選んだ席</h2>
      <div class="card" aria-live="polite">
        <p class="empty" id="seatEmpty">区画を選んでください。</p>
        <div id="seatBody" hidden style="display:grid;gap:12px">
          <div class="name" id="seatName"></div>
          <div>
            <div class="rowline"><span>列</span><b id="rowText"></b></div>
            <input type="range" id="rowRange" min="1" max="18" value="1" aria-label="列を選ぶ">
          </div>
          <dl class="stats">
            <dt>席種</dt><dd id="stK"></dd>
            <dt>座面の高さ</dt><dd id="stH"></dd>
            <dt>タッチラインまで</dt><dd id="stT"></dd>
            <dt>ピッチ中心まで</dt><dd id="stC"></dd>
            <dt>この層の傾斜</dt><dd id="stA"></dd>
          </dl>
          <div class="btns">
            <button type="button" id="goSeat">この席からの眺め</button>
            <button type="button" id="back" class="ghost" hidden>全体に戻る</button>
          </div>
        </div>
      </div>
    </section>

  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
var root=document.documentElement;
function $(s){return document.querySelector(s);}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s));}
var rad=function(d){return d*Math.PI/180;};
var clamp=function(v,a,b){return Math.max(a,Math.min(b,v));};
var reduceMotion=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var stage=$('#stage'), canvas=$('#c');

function fail(msg){stage.innerHTML='<p class="fail">'+msg+'</p>';}
if(!window.THREE){fail('3Dライブラリを読み込めませんでした。ネットワークを確認して再読み込みしてください。');return;}
var renderer;
try{renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true});}
catch(e){fail('このブラウザでは3D表示(WebGL)を開始できませんでした。');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));

/* ---------- model constants (metres). Slopes are from public sources; the rest is schematic. ---------- */
var PITCH_L=105, PITCH_W=68, TURF_L=115, TURF_W=78, STAND_L=104, Z_FRONT=44;
var T1={n:18,d:0.85,ang:29,h0:0.9}, T2={n:22,d:0.85,ang:33};
var CONC=3.5, LIFT2=1.4, T_SLAB=1.4, CLEAR=8.6, OVERLAP=6.85;
/* lower tier seat categories from the official seat map (south to north): cat 6 south x4, cat 4 south x3, cat 2 x6, cat 4 north x3, cat 6 north x4 */
var CAT_N=['カテゴリー6 指定(南側)','カテゴリー4 指定(南側)','カテゴリー2 指定','カテゴリー4 指定(北側)','カテゴリー6 指定(北側)'];
var CAT_I=[0,0,0,0,1,1,1,2,2,2,2,2,2,3,3,3,4,4,4,4];
var CAT_C=[new THREE.Color(0x14a085),new THREE.Color(0xd4dc3c),new THREE.Color(0x7b4fd0),new THREE.Color(0xd4dc3c),new THREE.Color(0x14a085)];
var KIND={1:'下層(2階から入場)',2:'上層 イースト自由席(4階から入場)'};
/* 20 blocks in total, assumed to be 10 per tier (numbers are provisional, south to north) */
var ZN_T={1:20,2:20}, AISLE_T={1:1.2,2:1.2};
function zoneLenT(t){return (STAND_L-AISLE_T[t]*(ZN_T[t]-1))/ZN_T[t];}
function zoneCxT(t,i){var L=zoneLenT(t);return -STAND_L/2+L/2+i*(L+AISLE_T[t]);}
function zoneLabel(t,i){return 'ブロック'+(i+1);}

var r1=T1.d*Math.tan(rad(T1.ang)), r2=T2.d*Math.tan(rad(T2.ang));
var rows={1:[],2:[]}, z=Z_FRONT, i;
for(i=0;i<T1.n;i++){rows[1].push({z0:z,zc:z+T1.d/2,h:T1.h0+i*r1});z+=T1.d;}
/* the upper tier sits above the lower tier: its front edge overhangs the rear rows of the lower stand */
var zConc=z-OVERLAP;
var h2=T1.h0+((zConc-Z_FRONT)/T1.d)*r1+CLEAR+T_SLAB;
z=zConc;
for(i=0;i<T2.n;i++){rows[2].push({z0:z,zc:z+T2.d/2,h:h2+i*r2});z+=T2.d;}
var zEnd=z;
var TIER={1:T1,2:T2};
/* concourse floor heights are schematic; the stands themselves are two separate bodies */
/* concourse floors are set to the entrance cross aisles: lower = row 7 (index 6), upper = row 4 (index 3) */
var F2=rows[1][6].h+0.5,F4=rows[2][3].h+0.5-3.0,F3=(F2+F4)/2,T_SLAB=1.4;
var zLowerEnd=rows[1][T1.n-1].z0+T1.d;
var hLast2=rows[2][T2.n-1].h;
var slopeU=(hLast2-h2)/(zEnd-zConc);
function zUnder(y){return zConc+(y-(h2-T_SLAB))/slopeU;}

/* ---------- theme tokens read from CSS ---------- */
var C={};
function readTheme(){
  var cs=getComputedStyle(root);
  function g(n){return new THREE.Color(cs.getPropertyValue(n).trim());}
  C.bg=g('--s-bg');C.ground=g('--s-ground');C.concrete=g('--s-concrete');C.ghost=g('--s-ghost');
  C.seat1=g('--s-seat1');C.seat2=g('--s-seat2');C.dim=g('--s-dim');C.hi=g('--s-hi');
  C.pitchA=g('--s-pitchA');C.pitchB=g('--s-pitchB');C.roof=g('--s-roof');C.label=g('--s-label');C.line=g('--s-line');
  var t=root.getAttribute('data-theme');
  C.dark=t==='dark'||(t!=='light'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
}
readTheme();

/* ---------- scene ---------- */
var scene=new THREE.Scene();
scene.fog=new THREE.Fog(0x000000,200,520);
var camera=new THREE.PerspectiveCamera(45,1,0.3,900);
var hemi=new THREE.HemisphereLight(0xffffff,0x667066,0.9); scene.add(hemi);
var sun=new THREE.DirectionalLight(0xffffff,0.7); sun.position.set(-60,90,-40); scene.add(sun);

var matGround=new THREE.MeshLambertMaterial({color:C.ground});
var ground=new THREE.Mesh(new THREE.PlaneGeometry(900,900),matGround);
ground.rotation.x=-Math.PI/2; ground.position.y=-0.03; scene.add(ground);

/* pitch with real FIFA markings */
var PS=16, pc=document.createElement('canvas'); pc.width=TURF_L*PS; pc.height=TURF_W*PS;
function m(v){return v*PS;}
function drawPitch(){
  var g=pc.getContext('2d'), s, side;
  for(s=0;s<23;s++){g.fillStyle=(s%2?C.pitchB:C.pitchA).getStyle();g.fillRect(s*5*PS,0,5*PS,pc.height);}
  g.save();g.translate(m((TURF_L-PITCH_L)/2),m((TURF_W-PITCH_W)/2));
  g.strokeStyle=C.line.getStyle();g.fillStyle=C.line.getStyle();g.lineWidth=0.2*PS;
  g.strokeRect(m(0.1),m(0.1),m(PITCH_L-0.2),m(PITCH_W-0.2));
  g.beginPath();g.moveTo(m(52.5),0);g.lineTo(m(52.5),m(PITCH_W));g.stroke();
  g.beginPath();g.arc(m(52.5),m(34),m(9.15),0,Math.PI*2);g.stroke();
  g.beginPath();g.arc(m(52.5),m(34),m(0.3),0,Math.PI*2);g.fill();
  var a=Math.acos(5.5/9.15);
  for(side=0;side<2;side++){
    var px=side?m(PITCH_L-16.5):0, gx=side?m(PITCH_L-5.5):0, sx=side?m(PITCH_L-11):m(11);
    g.strokeRect(px+(side?0:m(0.1)),m(34-20.16),m(16.5),m(40.32));
    g.strokeRect(gx+(side?0:m(0.1)),m(34-9.16),m(5.5),m(18.32));
    g.beginPath();g.arc(sx,m(34),m(0.3),0,Math.PI*2);g.fill();
    g.beginPath();
    if(side){g.arc(sx,m(34),m(9.15),Math.PI-a,Math.PI+a);}else{g.arc(sx,m(34),m(9.15),-a,a);}
    g.stroke();
  }
  g.beginPath();g.arc(0,0,m(1),0,Math.PI/2);g.stroke();
  g.beginPath();g.arc(m(PITCH_L),0,m(1),Math.PI/2,Math.PI);g.stroke();
  g.beginPath();g.arc(0,m(PITCH_W),m(1),-Math.PI/2,0);g.stroke();
  g.beginPath();g.arc(m(PITCH_L),m(PITCH_W),m(1),Math.PI,Math.PI*1.5);g.stroke();
  g.restore();
}
var pitchTex=new THREE.CanvasTexture(pc);
pitchTex.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());
var pitch=new THREE.Mesh(new THREE.PlaneGeometry(TURF_L,TURF_W),new THREE.MeshLambertMaterial({map:pitchTex}));
pitch.rotation.x=-Math.PI/2; pitch.position.y=0.01; scene.add(pitch);

/* goals */
var matWhite=new THREE.MeshLambertMaterial({color:0xf4f4f0});
[-1,1].forEach(function(sx){
  var gx=sx*PITCH_L/2;
  [-3.66,3.66].forEach(function(pz){var p=new THREE.Mesh(new THREE.BoxGeometry(0.12,2.44,0.12),matWhite);p.position.set(gx,1.22,pz);scene.add(p);});
  var bar=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.12,7.44),matWhite);bar.position.set(gx,2.44,0);scene.add(bar);
});

/* stand geometry (stepped profile extruded along the stand) */
function standShape(){
  var s=new THREE.Shape(), pts=[], k, r;
  s.moveTo(Z_FRONT,0);
  pts.push([Z_FRONT,rows[1][0].h]);
  for(k=0;k<T1.n;k++){r=rows[1][k];pts.push([r.z0+T1.d,r.h]);if(k<T1.n-1)pts.push([r.z0+T1.d,rows[1][k+1].h]);}
  pts.push([zConc,rows[1][T1.n-1].h]);pts.push([zConc,h2]);
  for(k=0;k<T2.n;k++){r=rows[2][k];pts.push([r.z0+T2.d,r.h]);if(k<T2.n-1)pts.push([r.z0+T2.d,rows[2][k+1].h]);}
  pts.push([zEnd,0]);
  pts.forEach(function(p){s.lineTo(p[0],p[1]);});
  return s;
}
function extrude(shape,len){
  var g=new THREE.ExtrudeGeometry(shape,{depth:len,bevelEnabled:false});
  g.rotateY(-Math.PI/2); g.translate(len/2,0,0); return g;
}
var matConcrete=new THREE.MeshLambertMaterial({color:C.concrete});
function lowerShape(){
  var s=new THREE.Shape(),k,r;
  s.moveTo(Z_FRONT,0);s.lineTo(Z_FRONT,rows[1][0].h);
  for(k=0;k<T1.n;k++){r=rows[1][k];s.lineTo(r.z0+T1.d,r.h);if(k<T1.n-1)s.lineTo(r.z0+T1.d,rows[1][k+1].h);}
  s.lineTo(zLowerEnd,0);return s;
}
function upperShape(){

function orbitView(tx,ty,tz,r,theta,phi){
  return {mode:'orbit',target:new THREE.Vector3(tx,ty,tz),r:r,theta:theta,phi:phi,pos:new THREE.Vector3(),yaw:0,pitch:0,fov:45};
}
function seatPose(px,py,pz,yaw,pitch,fov){
  return {mode:'seat',target:new THREE.Vector3(),r:100,theta:0,phi:1,pos:new THREE.Vector3(px,py,pz),yaw:yaw,pitch:pitch,fov:fov};
}
var PRESETS={
  overview:{label:'俯瞰',make:function(){return orbitView(0,8,52,120,Math.PI,1.0);}},
  section:{label:'断面',make:function(){return orbitView(0,12,60,110,Math.PI/2,1.36);}},
  top:{label:'真上',make:function(){return orbitView(0,0,22,150,Math.PI,0.03);}},
  pitch:{label:'ピッチ目線',make:function(){return seatPose(0,1.7,26,0,0.32,70);}}
};
var view=PRESETS.overview.make();
var tmpCam=new THREE.PerspectiveCamera();
function poseInto(cam,v){
  if(v.mode==='orbit'){
    var s=Math.sin(v.phi),c=Math.cos(v.phi);
    cam.position.set(v.target.x+v.r*s*Math.sin(v.theta),v.target.y+v.r*c,v.target.z+v.r*s*Math.cos(v.theta));
    cam.lookAt(v.target);
  }else{
    cam.position.copy(v.pos);
    var cp=Math.cos(v.pitch);
    cam.lookAt(v.pos.x+Math.sin(v.yaw)*cp,v.pos.y+Math.sin(v.pitch),v.pos.z+Math.cos(v.yaw)*cp);
  }
  cam.fov=v.fov;cam.updateProjectionMatrix();
}
function applyView(){poseInto(camera,view);dirty=true;}
var tweening=false;
function flyTo(v,ms){
  ms=reduceMotion?0:(ms==null?900:ms);
  if(ms===0){view=v;applyView();return;}
  var a={p:camera.position.clone(),q:camera.quaternion.clone(),f:camera.fov};
  poseInto(tmpCam,v);
  var b={p:tmpCam.position.clone(),q:tmpCam.quaternion.clone(),f:tmpCam.fov};
  var t0=performance.now();tweening=true;
  function step(now){
    var k=Math.min(1,(now-t0)/ms),e=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
    camera.position.lerpVectors(a.p,b.p,e);
    camera.quaternion.copy(a.q).slerp(b.q,e);
    camera.fov=a.f+(b.f-a.f)*e;camera.updateProjectionMatrix();dirty=true;
    if(k<1){requestAnimationFrame(step);}else{tweening=false;view=v;applyView();}
  }
  requestAnimationFrame(step);
}

function panBy(dx,dy){

  vRight.setFromMatrixColumn(camera.matrixWorld,0);vUp.setFromMatrixColumn(camera.matrixWorld,1);
  view.target.addScaledVector(vRight,-dx*k).addScaledVector(vUp,dy*k);
  view.target.x=clamp(view.target.x,-140,140);view.target.z=clamp(view.target.z,-140,140);view.target.y=clamp(view.target.y,-5,60);
}

    var before=Array.from(ptrs.values());
    var mx0=(before[0].x+before[1].x)/2,my0=(before[0].y+before[1].y)/2;
    p.x=e.clientX;p.y=e.clientY;

var FLOOR_INFO={
  1:'地上です。コンコースの縦階段(O入口の前、Q・R入口の中間の前、T入口の前)で上の階へ上がります。',
  2:'2階コンコース。入口O〜Tから下層スタンドに入れます。各入口の通路から階段で下りたところ(入口に向かって、O・P・Qは左側へ、R・S・Tは右側へ下る階段)に、男女トイレ7か所があります。南端の2階コンコースに授乳室があります。',
  3:'3階コンコース。北側にこども広場、反対の南側にスペースがあり、その間は壁で仕切られ、通路は壁の後ろ(外側)を通っています。',
  4:'4階コンコース。入口から階段を上って上層スタンドに入ります。上層と下層はつながっていないので注意してください。'
};
var floorsEl=$('#floors'), floorInfo=$('#floorInfo');
[1,2,3,4].forEach(function(f){
  var b=document.createElement('button');b.type='button';b.textContent=f+'階';b.dataset.f=f;
  b.setAttribute('aria-pressed','false');
  b.addEventListener('click',function(){selectFloor(f);});
  floorsEl.appendChild(b);
});
function clearFloorChips(){
  Array.prototype.forEach.call(floorsEl.children,function(b){b.setAttribute('aria-pressed','false');});
  floorInfo.textContent='階を選ぶと、入口やコンコース、入れるスタンドを確認できます。';
}
function setUpperHidden(h){
  upperBody.visible=!h;supportGroup.visible=!h;upperHiddenFlag=h;applyVis();
  seatMeshes.forEach(function(m){if(m.userData.tier===2)m.visible=!h;});
  $('#hideUpper').checked=h;dirty=true;
}
function selectFloor(f){
  if(tweening)return;
  selFloor=f;selGate=-1;refreshFloorColors();refreshGateColors();
  Array.prototype.forEach.call(gatesEl.children,function(b){b.setAttribute('aria-pressed','false');});
  Array.prototype.forEach.call(floorsEl.children,function(b){b.setAttribute('aria-pressed',+b.dataset.f===f?'true':'false');});
  floorInfo.textContent=FLOOR_INFO[f];
  setUpperHidden(f===2||f===3);
  gateGroup.visible=true;$('#gatesOn').checked=true;floorGroup.visible=true;
  atSeat=false;$('#back').hidden=true;clearPresetHighlight();setHud(f+'階');
  var y=f===1?0:(f===2?F2:(f===3?F3:F4));
  flyTo(orbitView(0,y+3,zOutAt(0),f===1?90:80,0.55,1.2));
}
$('#hideUpper').addEventListener('change',function(e){setUpperHidden(e.target.checked);});
$('#restOn').addEventListener('change',function(e){restOn=e.target.checked;applyVis();});
$('#onlyFloor').addEventListener('change',function(e){onlyOneFloor=e.target.checked;if(onlyOneFloor&&selFloor<1){selectFloor(2);}else{applyVis();}});
$('#gatesOn').addEventListener('change',function(e){gateGroup.visible=e.target.checked;dirty=true;});

/* ---------- render loop ---------- */
function resize(){
  var w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();dirty=true;
}
if(window.ResizeObserver){new ResizeObserver(resize).observe(stage);}
window.addEventListener('resize',resize);
resize();applyView();
function loop(){
  if(dirty){dirty=false;renderer.render(scene,camera);}
  requestAnimationFrame(loop);
}
loop();
})();
</script>
